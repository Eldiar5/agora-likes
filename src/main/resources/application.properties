spring.application.name=agora-likes

spring.config.import=optional:configserver:http://config-server:8888

# --- Exchange ---
rabbitmq.exchange.likes=likes.exchange

# --- Routing Keys ---
rabbitmq.routing.key.like-created=like.created.key
rabbitmq.routing.key.like-deleted=like.deleted.key

# --- Queues ---
rabbitmq.queue.like-created=stats.like.created.queue
rabbitmq.queue.like-deleted=stats.like.deleted.queue

